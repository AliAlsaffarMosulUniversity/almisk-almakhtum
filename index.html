<style>
:root{
  --bg:#07140f; --bg2:#0d231b; --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.11);
  --text:#f3f7f4; --muted:#a9bdb3; --gold:#e7c36a; --gold2:#b8892f; --chip:rgba(255,255,255,.08);
  --shadow:0 14px 34px rgba(0,0,0,.38);
}
:root[data-theme="light"]{
  --bg:#f5f1e6; --bg2:#ece5d2; --card:#ffffff; --line:rgba(20,50,40,.13);
  --text:#12261f; --muted:#56695f; --gold:#9a6d14; --gold2:#b8892f; --chip:rgba(20,60,45,.07);
  --shadow:0 12px 28px rgba(40,60,50,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif; color:var(--text);
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(231,195,106,.16), transparent 60%),
    radial-gradient(800px 520px at 0% 10%, rgba(16,185,129,.16), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed; min-height:100vh; line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 16px calc(40px + env(safe-area-inset-bottom))}
a{color:inherit; text-decoration:none}
button{font-family:inherit; color:inherit}

/* top bar */
.bar{position:sticky; top:0; z-index:20; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 78%,transparent); border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; background:none; border:0; padding:0}
.brand img{width:38px; height:38px; border-radius:11px; box-shadow:0 4px 12px rgba(0,0,0,.3)}
.brand b{font-family:"Amiri",serif; font-size:23px; color:var(--gold); letter-spacing:.3px}
.sp{flex:1}
.ib{width:42px; height:42px; border-radius:13px; border:1px solid var(--line); background:var(--chip);
  font-size:19px; cursor:pointer; display:grid; place-items:center; transition:.18s}
.ib:hover{transform:translateY(-2px); border-color:var(--gold)}

/* hero */
.hero{text-align:center; padding:34px 6px 8px}
.hero .bas{font-family:"Amiri",serif; color:var(--gold); font-size:clamp(20px,4.4vw,28px); margin:0}
.hero h1{font-family:"Amiri",serif; font-size:clamp(40px,10vw,74px); margin:4px 0 2px; line-height:1.25;
  background:linear-gradient(120deg,#f6e3a6,var(--gold) 45%,var(--gold2)); -webkit-background-clip:text; background-clip:text; color:transparent}
:root[data-theme="light"] .hero h1{background:linear-gradient(120deg,#8a5d0c,#b8892f); -webkit-background-clip:text; background-clip:text}
.hero p{color:var(--muted); margin:0 auto; max-width:620px; font-size:clamp(15px,3.6vw,18px)}

.search{margin:22px auto 6px; max-width:680px; display:flex; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:20px; padding:7px; box-shadow:var(--shadow)}
.search input{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font:500 17px "Tajawal",sans-serif; padding:10px 14px}
.search input::placeholder{color:var(--muted)}
.go{border:0; cursor:pointer; border-radius:15px; padding:0 22px; font:800 16px "Tajawal",sans-serif; color:#1b1404;
  background:linear-gradient(135deg,#f3d98c,#d8a94a); transition:.18s}
.go:hover{filter:brightness(1.08); transform:translateY(-1px)}

h2.sec{font-size:20px; margin:30px 4px 12px; display:flex; align-items:center; gap:8px}
h2.sec small{color:var(--muted); font-weight:500; font-size:14px}

/* category grid */
.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.cat{position:relative; overflow:hidden; border:0; cursor:pointer; text-align:right; color:#fff;
  border-radius:24px; padding:18px 16px 16px; min-height:148px; display:flex; flex-direction:column; justify-content:flex-end;
  background:linear-gradient(140deg,var(--a),var(--b)); box-shadow:0 12px 26px color-mix(in srgb,var(--b) 45%,transparent);
  transition:transform .2s, box-shadow .2s, filter .2s}
.cat::before{content:""; position:absolute; inset:-40% auto auto -30%; width:170px; height:170px; border-radius:50%;
  background:rgba(255,255,255,.16)}
.cat::after{content:""; position:absolute; inset:auto -25% -55% auto; width:190px; height:190px; border-radius:50%;
  background:rgba(0,0,0,.13)}
.cat:hover,.cat:focus-visible{transform:translateY(-6px) scale(1.02); filter:saturate(1.15); outline:0;
  box-shadow:0 20px 36px color-mix(in srgb,var(--b) 60%,transparent)}
.cat:active{transform:scale(.97)}
.cat .ic{position:absolute; top:12px; left:14px; font-size:40px; z-index:1; filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.cat b{position:relative; z-index:1; font-size:19px; font-weight:800; line-height:1.35}
.cat span{position:relative; z-index:1; font-size:13px; opacity:.92; margin-top:2px}

/* category page */
.head{margin-top:20px; border-radius:26px; padding:22px 20px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(140deg,var(--a),var(--b)); box-shadow:var(--shadow)}
.head::after{content:""; position:absolute; inset:auto -60px -90px auto; width:240px; height:240px; border-radius:50%; background:rgba(255,255,255,.13)}
.head .ic{font-size:46px; line-height:1}
.head h2{margin:6px 0 2px; font-size:clamp(26px,6vw,36px); font-weight:800}
.head p{margin:0; opacity:.95; position:relative; z-index:1}
.back{display:inline-flex; align-items:center; gap:6px; margin-top:16px; background:var(--chip); border:1px solid var(--line);
  border-radius:14px; padding:9px 16px; cursor:pointer; font:700 15px "Tajawal",sans-serif}
.back:hover{border-color:var(--gold)}

.tools{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 4px; align-items:center}
.tools .lbl{color:var(--muted); font-size:14px; margin-inline-end:2px}
.chip{border:1px solid var(--line); background:var(--chip); border-radius:999px; padding:7px 15px; cursor:pointer;
  font:700 14px "Tajawal",sans-serif; transition:.15s}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#f3d98c,#d8a94a); color:#1b1404; border-color:transparent}

.list{display:grid; gap:11px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); margin-top:14px}
.item{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:6px 8px 6px 6px; transition:.18s; border-inline-start:5px solid var(--a)}
.item:hover{transform:translateY(-3px); border-color:var(--a); box-shadow:var(--shadow)}
.item a{flex:1; padding:11px 8px; font-weight:700; font-size:16px; display:flex; align-items:center; gap:9px; min-width:0}
.item a .play{flex:none; width:30px; height:30px; border-radius:50%; background:linear-gradient(140deg,var(--a),var(--b));
  display:grid; place-items:center; color:#fff; font-size:12px}
.item a .tx{overflow:hidden; text-overflow:ellipsis}
.star{flex:none; width:38px; height:38px; border-radius:12px; border:0; background:none; cursor:pointer; font-size:19px; color:var(--muted)}
.star.on{color:var(--gold)}
.star:hover{background:var(--chip)}

.pick{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px; background:var(--card); border:1px solid var(--line);
  border-radius:18px; padding:12px 14px}
.pick label{font-weight:700}
.pick select,.pick input{flex:1; min-width:170px; background:var(--chip); color:var(--text); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; font:500 16px "Tajawal",sans-serif; outline:0}
.pick select option{color:#12261f; background:#fff}
.note{color:var(--muted); font-size:14px; margin:10px 4px 0}

.empty{color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:18px; padding:16px; text-align:center}
footer{margin-top:44px; text-align:center; color:var(--muted); font-size:14px; border-top:1px solid var(--line); padding-top:18px}
footer .aya{font-family:"Amiri",serif; color:var(--gold); font-size:22px; display:block; margin-bottom:4px}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@media (max-width:420px){ .grid{grid-template-columns:repeat(2,1fr); gap:11px} .cat{min-height:136px; border-radius:20px} .cat b{font-size:17px} .cat .ic{font-size:34px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>

/* ================== الحالة والتخزين ================== */
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let favs = store.get("misk-favs", []);
let mode = "all";
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = (q, m) => { const sp = (MODES.find(x => x.id === (m || mode)) || MODES[0]).sp; return YT + encodeURIComponent(q) + (sp ? "&sp=" + sp : ""); };
const isFav = q => favs.some(f => f.q === q);

function itemHTML(it, cat){
  return `<div class="item" style="--a:${cat.a};--b:${cat.b}">
    <a href="${url(it.q)}" target="_blank" rel="noopener"><span class="play">▶</span><span class="tx">${esc(it.t)}</span></a>
    <button class="star ${isFav(it.q) ? "on" : ""}" data-fav="${esc(it.q)}" data-t="${esc(it.t)}" data-c="${cat.id}" aria-label="إضافة إلى المفضلة" title="المفضلة">★</button>
  </div>`;
}

/* ================== الصفحات ================== */
function home(){
  mode = "all";
  document.title = "المسك المختوم — نافذتك على المحتوى الإسلامي في يوتيوب";
  const favHTML = favs.length
    ? `<div class="list">${favs.map(f => itemHTML(f, CATS.find(c => c.id === f.c) || CATS[0])).join("")}</div>`
    : `<div class="empty">اضغط على النجمة ★ بجانب أي عنوان ليظهر هنا.</div>`;
  app.innerHTML = `
  <section class="hero fade">
    <p class="bas">﴿ خِتَامُهُ مِسْكٌ ﴾</p>
    <h1>المسك المختوم</h1>
    <p>نافذتك الواحدة على المحتوى الإسلامي في يوتيوب. اختر القسم، ثم اختر ما تريد.</p>
    <form class="search" id="gs">
      <input id="gq" type="search" placeholder="ابحث عن قارئ، سورة، درس، خطبة..." autocomplete="off" aria-label="بحث">
      <button class="go" type="submit">بحث</button>
    </form>
  </section>
  <h2 class="sec">الأقسام <small>${CATS.length} قسماً</small></h2>
  <section class="grid fade">
    ${CATS.map(c => `<button class="cat" data-go="${c.id}" style="--a:${c.a};--b:${c.b}">
        <span class="ic" aria-hidden="true">${c.ic}</span><b>${esc(c.t)}</b><span>${esc(c.d)}</span></button>`).join("")}
  </section>
  <h2 class="sec" id="favs">★ المفضلة <small>${favs.length ? favs.length : ""}</small></h2>
  ${favHTML}
  ${foot()}`;
  document.getElementById("gs").onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById("gq").value.trim();
    if (v) window.open(url(v, "all"), "_blank", "noopener");
  };
}

function catPage(cat){
  document.title = cat.t + " — المسك المختوم";
  mode = cat.mode || "all";
  app.innerHTML = `
  <button class="back" data-home>→ الرئيسية</button>
  <section class="head fade" style="--a:${cat.a};--b:${cat.b}">
    <div class="ic" aria-hidden="true">${cat.ic}</div>
    <h2>${esc(cat.t)}</h2><p>${esc(cat.d)}</p>
  </section>
  <div class="tools"><span class="lbl">نوع النتائج:</span>
    ${MODES.map(m => `<button class="chip" data-mode="${m.id}" aria-pressed="${m.id === mode}">${m.t}</button>`).join("")}
  </div>
  <form class="pick" id="cs">
    <label for="cq">بحث داخل القسم</label>
    <input id="cq" type="search" placeholder="اكتب ما تبحث عنه في ${esc(cat.t)}" autocomplete="off">
    <button class="go" type="submit" style="padding:10px 20px">بحث</button>
  </form>
  <div id="body"></div>
  ${foot()}`;
  document.getElementById("cs").onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById("cq").value.trim();
    if (v) window.open(url(v + " " + (cat.id === "langs" ? "Islam" : cat.t)), "_blank", "noopener");
  };
  body(cat);
  window.scrollTo(0, 0);
}

function body(cat){
  const el = document.getElementById("body");
  let h = "";
  if (cat.quran){
    const s = store.get("misk-surah", "");
    h += `<h2 class="sec">القرّاء <small>${RECITERS.length} قارئاً</small></h2>
    <div class="pick"><label for="surah">السورة</label>
      <select id="surah"><option value="">المصحف كاملاً</option>
      ${SURAHS.map((n, i) => `<option value="${n}" ${n === s ? "selected" : ""}>${i + 1}. سورة ${n}</option>`).join("")}</select>
    </div>
    <p class="note">اختر السورة أولاً، ثم اضغط على اسم القارئ.</p>
    <div class="list">${RECITERS.map(r => {
      const q = (s ? "سورة " + s : "القرآن الكريم كاملا") + " بصوت " + r;
      return itemHTML({t: r, q}, cat);
    }).join("")}</div>
    <h2 class="sec">مختارات</h2>`;
  }
  h += `<div class="list fade">${cat.items.map(it => itemHTML(it, cat)).join("")}</div>`;
  el.innerHTML = h;
  const sel = document.getElementById("surah");
  if (sel) sel.onchange = () => { store.set("misk-surah", sel.value); body(cat); };
}

function foot(){
  return `<footer><span class="aya">﴿ وَفِي ذَٰلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ ﴾</span>
  المسك المختوم — جميع المقاطع تُعرض من يوتيوب مباشرة، والتطبيق لا يستضيف أي محتوى.<br>تصميم: علي الصفار</footer>`;
}

/* ================== التنقل والأحداث ================== */
function route(){
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const cat = CATS.find(c => c.id === id);
  cat ? catPage(cat) : home();
  if (id === "favs"){ const f = document.getElementById("favs"); if (f) f.scrollIntoView(); }
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go){ location.hash = "#/" + go.dataset.go; return; }
  if (e.target.closest("[data-home]") || e.target.closest("#home")){ location.hash = "#/"; return; }
  const m = e.target.closest("[data-mode]");
  if (m){
    mode = m.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    const cat = CATS.find(c => c.id === decodeURIComponent(location.hash.replace(/^#\/?/, "")));
    if (cat) body(cat);
    return;
  }
  const st = e.target.closest("[data-fav]");
  if (st){
    const q = st.dataset.fav;
    if (isFav(q)) favs = favs.filter(f => f.q !== q);
    else favs.unshift({t: st.dataset.t, q, c: st.dataset.c});
    store.set("misk-favs", favs);
    const onHome = !CATS.some(c => "#/" + c.id === location.hash);
    if (onHome) home(); else st.classList.toggle("on");
  }
});
document.getElementById("favBtn").onclick = () => {
  if (location.hash === "#/favs") { const f = document.getElementById("favs"); if (f) f.scrollIntoView(); }
  else location.hash = "#/favs";
};

/* المظهر */
const root = document.documentElement, tb = document.getElementById("theme");
function setTheme(t){ root.dataset.theme = t; tb.textContent = t === "light" ? "☾" : "☀"; store.set("misk-theme", t); }
setTheme(store.get("misk-theme", "dark"));
tb.onclick = () => setTheme(root.dataset.theme === "light" ? "dark" : "light");

route();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
